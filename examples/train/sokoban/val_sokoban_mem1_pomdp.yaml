envs:
  - name: Sokoban
    n_envs: 64
    data_source: sokoban_pomdp
    seed: [10001, 10064, 1]
    max_turns: 10
    response_length_per_turn: 512
    config:
      render_mode: text
      partial_obs_radius: 1
      max_actions_per_step: 1
      min_solution_steps: [1, 5]
      format_reward: 0.0
      prompt_format: mem1
